<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
</head>
<body>
    <h1>Contact me</h1>

    <form action="Contact-page">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" name="email"><br><br>
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="50"    placeholder="Enter your message here"></textarea><br><br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
