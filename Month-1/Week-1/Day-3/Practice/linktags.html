<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>link tag</title>
</head>
<body>

    <!-- This is an absolute link -->
    <!-- <a href="URL">Clickable Text</a> -->
    <a href="https://www.example.com">Visit Example</a><br>

    <!-- This is a relative link -->
    <a href="about.html">About Us</a>

    <!-- This is an email link -->
    <a href="mailto:info@example.com">Email Us</a><br>

    <!-- This is a telephone link -->
    <a href="tel:+1234567890">Call Us</a><br>   

    <!-- This is a link to a specific section within the same page -->
    <a href="#section1">Go to Section 1</a><br>

    <h2 id="section1">Section 1</h2>
    <p>This is Section 1 of the page.</p>

    <!-- download link -->
    <a href="document.pdf" download>Download Document</a>

    <!-- image link -->
    <a href="image.jpg">
        <img src="thumbnail.jpg" alt="Thumbnail">
    </a>

    <!-- Opening links in a new tab -->
    <a href="https://www.example.com" target="_blank">Visit Example in New Tab</a>

    
</body>
</html>
