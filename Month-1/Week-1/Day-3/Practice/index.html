    <!--Form tag-->

    <form>
      <h2>Registration Form</h2>

      <label for="name">Name:</label>
      <input type="text" id="name" name="name" placeholder="Enter your name.."/><br /><br />

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" placeholder="Enter your email.."/><br /><br />

      <label for="password">Password:</label>
      <input type="password" id="password" name="password" placeholder="Enter your password.."/><br /><br />

      <label for="Phone">Phone:</label>
      <input type="number" id="Phone" name="Phone" placeholder="Enter your phone number.."/><br /><br />
        <label for="gender">Gender:</label> 
      <input type="radio" id="male" name="gender" value="Male" />
      <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="Female" />
      <label for="female">Female</label><br /><br />

       <label for="hobbies">Hobbies:</label>
        <input type="checkbox" id="hobby1" name="hobbies" value="Reading" />
        <label for="hobby1">Reading</label> 
        <input type="checkbox" id="hobby2" name="hobbies" value="Traveling" />
        <label for="hobby2">Traveling</label>
        <input type="checkbox" id="hobby3" name="hobbies" value="Cooking" />
        <label for="hobby3">Cooking</label><br /><br />

         <label for="image">Photo:</label>
        <input type="file" id="image" name="image" /><br /><br />

        <input type="date">
        <input type="time">
        <input type="color">
        <input type="range" min="0" max="100">
        <input type="reset" value="Reset Form">
        <!-- <input type="month">
        <input type="week"> -->
        <input type="search" placeholder="Search...">
        <label for="url">Website:</label>
        <input type="url" id="url" placeholder="https://example.com">
        <br /><br />


      <input type="submit" value="Submit" />
    </form>
  </body>
