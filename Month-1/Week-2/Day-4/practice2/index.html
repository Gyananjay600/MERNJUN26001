<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-5">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-xl overflow-hidden flex">

        <!-- Left Side -->
        <div class="hidden md:flex w-1/2 bg-slate-900 text-white p-12 flex-col justify-between">

            <div>
                <h2 class="text-3xl font-bold mb-4">
                    Welcome Back
                </h2>

                <p class="text-slate-300 leading-7">
                    Access your account and continue your journey.
                    Manage projects, collaborate with teams, and
                    stay productive.
                </p>
            </div>

            <div>
                <p class="text-sm text-slate-400">
                    © 2026 Your Company
                </p>
            </div>

        </div>

        <!-- Right Side -->
        <div class="w-full md:w-1/2 p-10 md:p-14">

            <div class="mb-10">
                <h1 class="text-3xl font-bold text-slate-800">
                    Sign In
                </h1>

                <p class="text-slate-500 mt-2">
                    Enter your credentials to continue
                </p>
            </div>

            <form class="space-y-5">

                <div>
                    <label class="block mb-2 text-sm font-medium text-slate-700">
                        Email Address
                    </label>

                    <input
                        type="email"
                        placeholder="example@gmail.com"
                        class="w-full border border-slate-300 px-4 py-3 rounded-xl focus:outline-none focus:border-slate-900"
                    >
                </div>

                <div>
                    <label class="block mb-2 text-sm font-medium text-slate-700">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Enter Password"
                        class="w-full border border-slate-300 px-4 py-3 rounded-xl focus:outline-none focus:border-slate-900"
                    >
                </div>

                <div class="flex justify-between items-center">

                    <label class="flex items-center gap-2 text-sm text-slate-600">
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#" class="text-sm text-slate-800 hover:underline">
                        Forgot Password?
                    </a>

                </div>

                <button
                    type="submit"
                    class="w-full bg-slate-900 text-white py-3 rounded-xl hover:bg-black transition"
                >
                    Sign In
                </button>

            </form>

            <p class="text-center mt-8 text-slate-600">
                Don't have an account?
                <a href="#" class="font-semibold text-slate-900">
                    Create Account
                </a>
            </p>

        </div>

    </div>

</body>
</html>
