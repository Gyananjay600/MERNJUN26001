<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card UI Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Product Card -->

    <div class="main-container">

        <div class="product-card">

            <div class="card-image">
                <div class="image-icon">🖼️</div>
            </div>

            <div class="card-content">

                <div class="label">
                    Label
                </div>

                <h2 class="title">
                    Heading
                </h2>

                <p class="description">
                    This is a short description about the card.
                </p>

                <button class="action-btn">
                    Action
                </button>

            </div>

        </div>

    </div>


    <!-- Feature Cards -->

    <div class="feature-container">

        <div class="feature-card">
            <h2>Assess</h2>
            <p>
                Test your design skills and establish benchmarks.
            </p>
        </div>

        <div class="feature-card">
            <h2>Learn</h2>
            <p>
                Access a design library of course.
            </p>
        </div>

        <div class="feature-card">
            <h2>Showcase</h2>
            <p>
                Every skill you learn is automatically recorded on profile.
                Show it off and see how you stack up to other designers.
            </p>
        </div>

    </div>

</body>
</html>
