<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- Top Featured Section -->
    <div class="top-grid">
        <div class="top-card">
            <img src="https://picsum.photos/500/300?1" alt="">
        </div>

        <div class="top-card">
            <img src="https://picsum.photos/500/300?2" alt="">
        </div>

        <div class="top-card">
            <img src="https://picsum.photos/500/300?3" alt="">
        </div>
    </div>

    <!-- Content Section -->
    <div class="content-grid">

        <!-- Left Gallery -->
        <div class="gallery">

            <div class="item"><img src="https://picsum.photos/200/150?4"></div>
            <div class="item"><img src="https://picsum.photos/200/150?5"></div>
            <div class="item"><img src="https://picsum.photos/200/150?6"></div>
            <div class="item"><img src="https://picsum.photos/200/150?7"></div>

            <div class="item"><img src="https://picsum.photos/200/150?8"></div>

            <div class="item large-row">
                <img src="https://picsum.photos/300/400?9">
            </div>

            <div class="item"><img src="https://picsum.photos/200/150?10"></div>

            <div class="item"><img src="https://picsum.photos/200/150?11"></div>

            <div class="item"><img src="https://picsum.photos/200/150?12"></div>

            <div class="item"><img src="https://picsum.photos/200/150?13"></div>

            <div class="item"><img src="https://picsum.photos/200/150?14"></div>

            <div class="item"><img src="https://picsum.photos/200/150?15"></div>

            <div class="item"><img src="https://picsum.photos/200/150?16"></div>

            <div class="item"><img src="https://picsum.photos/200/150?17"></div>

            <div class="item wide">
                <img src="https://picsum.photos/400/250?18">
            </div>

            <div class="item"><img src="https://picsum.photos/200/150?19"></div>

            <div class="item"><img src="https://picsum.photos/200/150?20"></div>

            <div class="item"><img src="https://picsum.photos/200/150?21"></div>

        </div>

        <!-- Right Sidebar -->
        <div class="sidebar">

            <div class="side-card">
                <img src="https://picsum.photos/300/250?22">
            </div>

            <div class="side-card">
                <img src="https://picsum.photos/300/400?23">
            </div>

            <div class="side-card">
                <img src="https://picsum.photos/300/300?24">
            </div>

        </div>

    </div>

</div>

</body>
</html>
